[package]
name = "kuro-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "AniList, MyAnimeList and music clients, OAuth and secret storage"

[dependencies]
kuro-core = { path = "../core" }
base64 = "0.22"
jiff = "1"
getrandom = "0.3"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "query", "gzip", "http2", "charset", "system-proxy", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tracing = "0.1"
url = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[lints]
workspace = true
