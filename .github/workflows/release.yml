name: Release

# Publishes develop: main is fast-forwarded to it and tagged with the version in
# Cargo.toml, the executable is published, and develop moves to the next minor version.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package everything, publish nothing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check and describe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version and preconditions
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          HAS_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/develop ] || fail "Run this from develop, not $GITHUB_REF"
          version=$(grep -m1 -oP '^version = "\K\d+\.\d+\.\d+(?=")' Cargo.toml) || fail "No X.Y.Z version in Cargo.toml"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            # A retry of this same commit may go on.
            [ "$(git rev-parse "v$version^{commit}")" = "$GITHUB_SHA" ] || fail "v$version already exists on another commit"
          fi
          git merge-base --is-ancestor origin/main "$GITHUB_SHA" || fail "main has commits that develop lacks: merge main into develop first"
          [ "$DRY_RUN" = true ] || [ "$HAS_KEY" = true ] || fail "The RELEASE_DEPLOY_KEY secret is missing"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "## Kuro $version" >> "$GITHUB_STEP_SUMMARY"
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: git-cliff@2.14.2
          fallback: none
      - name: Notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # What users read first is the English of crates/setup/whats-new.txt, the same lines
        # the setup shows; the commits follow, for the details. CI checks the file's shape, but
        # only here must this version's section have lines: develop starts each one empty.
        run: |
          mkdir out
          awk -v want="[$VERSION]" '
            { sub(/\r$/, ""); sub(/^[ \t]+/, ""); sub(/[ \t]+$/, "") }
            /^(#|$)/ { next }
            /^\[/ { on = ($0 == want); next }
            on { split($0, cell, "|"); sub(/[ \t]+$/, "", cell[1]); print "- " cell[1] }
          ' crates/setup/whats-new.txt > out/whats-new.md
          if [ ! -s out/whats-new.md ]; then
            echo "::error file=crates/setup/whats-new.txt::No changes under [$VERSION]: add what is new for users, in every language, before releasing"
            exit 1
          fi
          {
            cat out/whats-new.md
            echo
            echo "## Changes in detail"
            echo
            git cliff --unreleased --tag "v$VERSION" --strip header
          } > out/notes.md
          cat out/notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: out
          if-no-files-found: error
          retention-days: 14

  ci:
    name: CI
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      installer-tests: true
    secrets:
      KURO_GOOGLE_CLIENT_SECRET: ${{ secrets.KURO_GOOGLE_CLIENT_SECRET }}

  package:
    name: Package
    needs: [prepare, ci]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kuro-${{ github.sha }}
          path: in
      - name: Zip and installer
        id: build
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "kuro-$env:VERSION-windows-x64"
          New-Item -ItemType Directory $name, dist | Out-Null
          Copy-Item in/kuro.exe, in/THIRD-PARTY-LICENSES.html, README.md, crates/app/assets/fonts/PHOSPHOR-LICENSE.txt $name
          Compress-Archive $name "dist/$name.zip"
          Copy-Item in/kuro-setup.exe "dist/$name-setup.exe"
          # Built by CI as other versions, to test moving between them.
          $newer = $env:VERSION -replace '^(\d+)\.(\d+)\..*', '$1.1$2.0'
          "newer=$newer" >> $env:GITHUB_OUTPUT
      - name: Install, update and uninstall
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NEWER: ${{ steps.build.outputs.newer }}
        run: |
          Copy-Item "dist/kuro-$env:VERSION-windows-x64-setup.exe" "in/test/kuro-$env:VERSION-setup.exe"
          packaging/windows/test.ps1 -Folder "$PWD/in/test" -Older 0.0.9 -Version $env:VERSION -Newer $env:NEWER
      - name: Checksums
        shell: bash
        working-directory: dist
        run: sha256sum --text kuro-* | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Tag and publish
    if: ${{ !inputs.dry_run }}
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      # The workflow's own token may not push changes to workflow files; the key may.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true
      # Both or neither. A lightweight tag makes a retry harmless.
      - name: Move main and tag
        env:
          TAG: v${{ needs.prepare.outputs.version }}
        working-directory: repo
        run: git push --atomic origin "$GITHUB_SHA:refs/heads/main" "$GITHUB_SHA:refs/tags/$TAG"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --draft --title "Kuro ${TAG#v}" --notes-file notes/notes.md
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest

  next:
    name: Next version on develop
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Bump
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if ! grep -q "^version = \"$VERSION\"$" Cargo.toml; then
            echo "develop has already moved on from $VERSION"
            exit 0
          fi
          IFS=. read -r major minor _ <<< "$VERSION"
          next="$major.$((minor + 1)).0"
          sed -i "s/^version = \"$VERSION\"$/version = \"$next\"/" Cargo.toml
          # An empty section for the next version, filled as changes land; CI checks it is there.
          awk -v next_version="$next" '!done && /^\[/ { print "[" next_version "]"; print ""; done = 1 } { print }' \
            crates/setup/whats-new.txt > "$RUNNER_TEMP/whats-new.txt"
          mv "$RUNNER_TEMP/whats-new.txt" crates/setup/whats-new.txt
          # Only the workspace's own entries change in the lock file.
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: start $next"
          git push origin HEAD:develop
