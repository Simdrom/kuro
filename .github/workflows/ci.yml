name: CI

on:
  push:
    branches: [develop]
    paths-ignore: ["**.md", "LICENSE*", ".gitignore"]
  # No paths-ignore here: a required check that never runs blocks the pull request.
  pull_request:
  schedule:
    # New advisories appear without any change here.
    - cron: "23 6 * * 1"
  workflow_dispatch:
  # The release runs these same checks.
  workflow_call:
    inputs:
      installer-tests:
        description: Also build setups of other versions, to test moving between them
        type: boolean
        default: false
    # A called workflow sees no secrets unless the caller passes them.
    secrets:
      KURO_GOOGLE_CLIENT_SECRET:
        required: false

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info is not needed to run the tests, and it doubles what is built and cached.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  check:
    name: Clippy and tests
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only develop fills the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  whats-new:
    name: What's new
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A reminder, not a failure: not every feat or fix is something users notice.
      - name: Changes for users are in whats-new.txt
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || exit 0
          commits=$(git log --format=%s "$BASE..$HEAD" | grep -E '^(feat|fix)(\(.+\))?!?:' || true)
          [ -n "$commits" ] || exit 0
          if git diff --quiet "$BASE...$HEAD" -- crates/setup/whats-new.txt; then
            echo "::warning file=crates/setup/whats-new.txt::New features or fixes, but no line in whats-new.txt. If users will notice them, add one under the first [version]."
            echo "$commits"
          fi

  msrv:
    name: Minimum Rust version
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the version in Cargo.toml
        id: msrv
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^rust-version = "(.+)"').Matches[0].Groups[1].Value
          rustup toolchain install $v --profile minimal
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: cargo "+$env:MSRV" check --workspace --all-targets --locked
        env:
          MSRV: ${{ steps.msrv.outputs.version }}

  release:
    name: Release build (${{ matrix.setup }})
    # Pull requests do not ship anything. Runs beside the checks, not after them, to save
    # their minutes; the release's package job still waits for every check.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        # The setup that ships and, for the release, the same program as two other versions,
        # only to test moving between them. Each builds on its own runner, side by side.
        setup: ${{ fromJSON(inputs.installer-tests && '["shipped", "0.0.9", "newer"]' || '["shipped"]') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
          # One writer: the others build the same thing.
          save-if: ${{ github.ref == 'refs/heads/develop' && matrix.setup == 'shipped' }}
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-about@0.9.3
          fallback: none
      # The licences are gathered while the program compiles: they do not depend on it.
      - name: Program and licences
        shell: pwsh
        env:
          # Public identifiers, not secrets. Empty means everyone brings their own.
          KURO_ANILIST_CLIENT_ID: ${{ vars.KURO_ANILIST_CLIENT_ID }}
          KURO_MAL_CLIENT_ID: ${{ vars.KURO_MAL_CLIENT_ID }}
          # Google calls a desktop app's secret not confidential; kept out of sight anyway.
          KURO_GOOGLE_CLIENT_ID: ${{ vars.KURO_GOOGLE_CLIENT_ID }}
          KURO_GOOGLE_CLIENT_SECRET: ${{ secrets.KURO_GOOGLE_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory out | Out-Null
          $here = $PWD.Path
          $about = Start-Job {
            Set-Location $using:here
            cargo about generate --locked --fail -o out/THIRD-PARTY-LICENSES.html about.hbs 2>&1
            "exit=$LASTEXITCODE"
          }
          cargo build --release --locked -p kuro
          $built = $LASTEXITCODE
          $output = @(Receive-Job $about -Wait)
          $output | Select-Object -SkipLast 1 | Out-Host
          if ($built) { exit $built }
          if ($output[-1] -ne 'exit=0') { Write-Host "cargo about: $($output[-1])"; exit 1 }
          Copy-Item target/release/kuro.exe out
      # The setup carries the program and its licences inside.
      - name: Setup
        shell: pwsh
        env:
          SETUP: ${{ matrix.setup }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:KURO_PAYLOAD = "$PWD/out"
          # 0.2.0 gives 0.12.0, which sorts the wrong way if compared as text; 0.0.9 reads
          # older lists only.
          switch ($env:SETUP) {
            'shipped' { $to = 'out/kuro-setup.exe' }
            '0.0.9' {
              $env:KURO_SETUP_VERSION = '0.0.9'
              $env:KURO_SETUP_SCHEMA = '1'
            }
            'newer' {
              $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
              $env:KURO_SETUP_VERSION = $version -replace '^(\d+)\.(\d+)\..*', '$1.1$2.0'
            }
          }
          if (-not $to) {
            New-Item -ItemType Directory test | Out-Null
            $to = "test/kuro-$env:KURO_SETUP_VERSION-setup.exe"
          }
          cargo build --release --locked -p kuro-setup
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item target/release/kuro-setup.exe $to
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kuro-${{ github.sha }}${{ matrix.setup != 'shipped' && format('-test-{0}', matrix.setup) || '' }}
          path: ${{ matrix.setup == 'shipped' && 'out' || 'test' }}
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: Advisories, licences and sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ready-made cargo-deny instead of compiling it on every run.
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          # Its image's rustup no longer installs what rust-toolchain.toml asks for, and
          # fails before checking anything; this installs that toolchain first.
          rust-version: stable

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: zizmor@1.33.1
          fallback: none
      - run: zizmor --no-online-audits .github
      - name: actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          gh release download "v$VERSION" -R rhysd/actionlint -p "actionlint_${VERSION}_linux_amd64.tar.gz" -O "$RUNNER_TEMP/actionlint.tgz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
