[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib", "CC0-1.0", "0BSD", "OFL-1.1", "Ubuntu-font-1.0", "bzip2-1.0.6", "NCSA"]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
